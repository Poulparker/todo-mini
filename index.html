<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мини-задачник</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>Мини-задачник</h1>
      <p class="app__subtitle">Задачи хранятся в этом браузере (localStorage)</p>
    </header>

    <div id="storage-alert" class="alert" role="alert" hidden>
      <p id="storage-alert-text" class="alert__text"></p>
      <button id="storage-alert-close" class="alert__close" type="button" title="Скрыть">×</button>
    </div>

    <form id="task-form" class="task-form" autocomplete="off" novalidate>
      <input id="task-input" class="task-form__input" type="text"
             placeholder="Что нужно сделать?" aria-label="Новая задача"
             aria-describedby="form-error">
      <button class="task-form__button" type="submit">Добавить</button>
    </form>
    <p id="form-error" class="task-form__error" role="alert" hidden></p>

    <nav class="filters" aria-label="Фильтр задач">
      <button class="filters__button" type="button" data-filter="all">Все</button>
      <button class="filters__button" type="button" data-filter="active">Активные</button>
      <button class="filters__button" type="button" data-filter="done">Выполненные</button>
    </nav>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty-state" class="empty-state">Задач пока нет — добавьте первую.</p>

    <footer class="app__footer">
      <span id="counter">0 из 0 выполнено</span>
      <button id="clear-done" class="link-button" type="button">Удалить выполненные</button>
    </footer>
  </main>

  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
