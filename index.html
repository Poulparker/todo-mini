<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мини-задачник</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>Мини-задачник</h1>
      <p class="app__subtitle">Задачи хранятся в этом браузере (localStorage)</p>
    </header>

    <form id="task-form" class="task-form" autocomplete="off">
      <input id="task-input" class="task-form__input" type="text"
             placeholder="Что нужно сделать?" maxlength="200" aria-label="Новая задача">
      <button class="task-form__button" type="submit">Добавить</button>
    </form>
    <p id="form-error" class="task-form__error" role="alert" hidden>Введите текст задачи</p>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty-state" class="empty-state">Задач пока нет — добавьте первую.</p>

    <footer class="app__footer">
      <span id="counter">0 из 0 выполнено</span>
      <button id="clear-done" class="link-button" type="button">Удалить выполненные</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
